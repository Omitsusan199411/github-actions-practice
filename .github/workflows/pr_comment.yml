name: PR Comment
on:
  pull_request:
    paths:
      - ".github/workflows/pr_comment.yml"
jobs:
  comment:
    runs-on: ubuntu-latest
    permissions: # GITHUB_TOKENの権限を設定（GitHub Actionsが自動生成する認証トークン。ワークフロー実行中にGitHub APIとやりとりするために必要）
      pull-requests: write # プルリクエストの書き込みを許可
      contents: read # ソースコードの読み込みを許可
    steps:
      - uses: actions/checkout@v4
      - run: gh pr comment "${GITHUB_HEAD_REF}" --body "Hello, ${GITHUB_ACTOR}" # プルリクにコメントを追加。${GITHUB_HEAD_REF}はPRの元ブランチを指し、pull_requestトリガーの時のみ値が入る
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}} # GitHub Actionsが自動生成する認証トークンをGITHUB_TOKEN環境変数にセットすることで、GitHub CLIがGitHub Actionsの認証を行い、機能を使えるようにするため
