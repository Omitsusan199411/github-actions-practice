name: Artifacts
on:
  push:
    paths:
      - '.github/workflows/artifacts.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: date > date.txt # アーティファクト（ワークフローで生成したファイル）の生成
      - uses: actions/upload-artifact@v4 # アーティファクトのアップロードができるアクション
        with:
          name: uploaded # アーティファクト名
          path: date.txt # アップロードの対象パス
          retention-day: 7 # アーティファクトの保存期間
  download:
    runs-on: ubuntu-latest
    needs: [upload] # uploadジョブの実行を待つ
    steps:
      - uses: actions/download-artifact@v4 # アーティファクトをダウンロードするためのアクション
        with:
          name: uploaded # アーティファクト名
          path: downloaded # ダウンロード先のパス
      - run: cat downloaded/date.txt # アーティファクトの中身を標準出力

    
	
