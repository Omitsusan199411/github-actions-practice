name: Environments
on:
  workflow_dispatch:
   inputs:
     environment-name:
       type: environment # 入力パラメータでEnvironmetsを切り替え
       default: test
       required: false
       description: Environment Name

jobs:
  print:
    runs-on: ubuntu-latest
    environment: ${{inputs.environment-name}} # 利用するEnvironmentsを切り替え
    env:
     USERNAME: ${{vars.USERNAME}} # Environment variablesを参照
     PASSWORD: ${{secrets.PASSWORD}} # Environment secretsを参照
    steps:
      - run: echo "${USERNAME}"
      - run: echo "${PASSWORD:0:1}${PASSWORD#?}"

  
