name: Share job data
on:
  push:
    paths:
      - '.github/workflows/share_job_data.yml'

jobs:
  before:
    runs-on: ubuntu-latest
    steps:
      - id: generate # データを参照してもらうためにステップIDを設定
        run: echo "result=Hello" >> "${GITHUB_OUTPUT}" # GITHUB_OUTPUTはステップレベルまでしか値を参照させることができない。（ジョブレベルでデータを受け渡しするにはoutputsキーの設定が必要）
    outputs:
      result: ${{steps.generate.outputs.result}} # outputsキーを設定することで他のジョブに値を受け渡すことができる
  after:
    runs-on: ubuntu-latest
    needs: [before]
    steps:
      - env:
          RESULT: ${{needs.before.outputs.result}} # needsコンテキストからoutputsキーで設定した値を参照できる（別のジョブからデータを参照できる）
        run: echo "${RESULT}"
