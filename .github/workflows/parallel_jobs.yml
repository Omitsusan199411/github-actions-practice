name: Parallel jobs
on:
  push:
    paths:
      - '.github/workflows/parallel_jobs.yml'

jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "First Job"
  second:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "Second Job"
  third:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 10 && echo "Third job"
