name: Secrets
on:
  push:
    paths:
      - '.github/workflows/environment.yml'
jobs:
  print:
    runs-on: ubuntu-latest
    env:
      PASSWORD: ${{secrets.PASSWORD}}
    steps:
      - run: echo "${PASSWORD}" # ログ出力はマスクされる
      - run: echo "${PASSWORD:0:1} ${PASSWORD#?}" # ログ出力はマスクをバイパスする可能性がある（危険）
