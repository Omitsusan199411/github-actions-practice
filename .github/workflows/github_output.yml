name: GITHUB OUTPUT
on:
  push:
    paths:
      - ".github/workflows/github_output.yml"

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - id: source # ステップIDを指定
        run: echo "result=Hello" >> "${GITHUB_OUTPUT}" # result=Helloのキー&バリュー形式をGITHUB_OUTPUTへ書き出し
      - env:
          RESULT: ${{steps.source.outputs.result}} # stepsコンテキストから参照（steps.<step-id>.outputs.<key>） # ステップIDと参照したい値のキー名をそれぞれ指定
        run: echo "${RESULT}"
